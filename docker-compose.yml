# HH Attendance Tracker Docker Compose Configuration
version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: hh-attendance-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: your_secure_mongo_password
      MONGO_INITDB_DATABASE: attendance_tracker
    volumes:
      - mongodb_data:/data/db
      - ./mongodb-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "27017:27017"
    networks:
      - attendance-network
    command: mongod --auth

  # HH Attendance Tracker Application
  app:
    build: .
    container_name: hh-attendance-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:your_secure_mongo_password@mongodb:27017/attendance_tracker?authSource=admin
      FRONTEND_URL: https://yourdomain.com
      JWT_SECRET: your_super_secure_jwt_secret_key_here
      JWT_EXPIRE: 30d
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - attendance-network
    volumes:
      - ./logs:/app/logs

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: hh-attendance-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - attendance-network

volumes:
  mongodb_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  attendance-network:
    driver: bridge
